services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/vrindtime/stackleweb-admin:latest
    expose:
      - "8080"
    networks:
      - caddy_gateway
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  caddy_gateway:
    external: true
