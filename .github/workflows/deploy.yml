name: Stackle Admin Deployment

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/stackle-web-admin:latest" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: stackle-admin
          key: ${{ secrets.VPS_SSH_KEY }}
          # 1. Map GitHub secrets to runner env variables
          envs: GITHUB_TOKEN,GITHUB_ACTOR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        script: |
          # 2. Use the mapped environment variables on the remote host safely
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Navigate to the dedicated frontend admin directory
          cd /srv/stackle-admin/flutter

          # Pull only the new frontend image from the registry
          docker compose pull frontend

          # Rolling update: spins up the new version, runs health checks, swaps traffic, drops old container
          docker compose up -d --no-deps frontend

          # Clean up old images safely on the host
          docker image prune -f